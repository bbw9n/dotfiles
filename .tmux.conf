set -g allow-passthrough on
# prefixキーをC-aに変更する
set -g prefix C-a

# C-bのキーバインドを解除する
unbind C-b

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-a*2でtmux内のプログラムにC-aを送る
bind C-a send-prefix

# | でペインを縦に分割する
bind | split-window -h

# - でペインを横に分割する
bind - split-window -v

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g extended-keys on
set -as terminal-features ',*:extkeys'
set -as terminal-features ',*:RGB'  # pass 24-bit color through to the outer terminal

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'
set -g @plugin 'robhurring/tmux-spotify'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux startup
set -g @continuum-restore 'on'

# マウス操作を有効にする
#set-window-option -g exit-copy-past-bottom on
set-option -g mouse on
set -g history-limit 30000

#bind-key -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
#bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

#set -g mouse on
#bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
#bind -n WheelDownPane select-pane -t= \; send-keys -M
#bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
#bind -t vi-copy    C-WheelUpPane   halfpage-up
#bind -t vi-copy    C-WheelDownPane halfpage-down
#bind -t emacs-copy C-WheelUpPane   halfpage-up
#bind -t emacs-copy C-WheelDownPane halfpage-down

# 256色端末を使用する
#set -g default-terminal "screen-256color"
#set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
#set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# https://www.nordtheme.com/docs/colors-and-palettes
# Frost
green_milk="#8fbcbb"
cyan_soft="#88c0d0"
blue_muted="#81a1c1"
blue_grey="#5e81ac"
# Polar Night
grey_dark="#2e3440"
grey_light="#4c566a"

# ステータスバーの色を設定する
set -g status-style fg=white,bg=black

# ウィンドウリストの色を設定する
setw -g window-status-style fg=cyan,bg=default,dim
# アクティブなウィンドウを目立たせる
setw -g window-status-current-format "#[fg=CadetBlue,bold,bg=default]  #[underscore]#I: #W"

# ペインボーダーの色を設定する
set -g pane-border-style fg=${cyan_soft}
# アクティブなペインを目立たせる
set -g pane-active-border-style fg=white,bg=${blue_muted}

# コマンドラインの色を設定する
set -g message-style fg=white,bg=black,bright

# ステータスバーを設定する
## 左パネルを設定する
set -g status-left-length 120
set -g status-left "#[fg=${blue_muted},bold] Session: #S #[fg=${green_milk}]#I #[fg=${cyan_soft}]#P | #[fg=${blue_muted},bold][ = #{cpu}  = #{mem}"]
## 右パネルを設定する
set -g status-right-length 120
set -g status-right "#[fg=${cyan_soft},bold]♫ #{music_status} #{artist}: #{track} | %a %h-%d %H:%M "
# set -g status-right "#[fg=${blue_muted},bold]=#{cpu} =#{mem} #[fg=${cyan_soft},bold][%Y-%m-%d(%a) %H:%M]"
## ステータスバーのUTF-8サポートを有効にする
#set -g status-utf8 on
## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 60
## ウィンドウリストの位置を中心寄せにする
set -g status-justify centre
## ヴィジュアルノーティフィケーションを有効にする
setw -g monitor-activity on
set -g visual-activity on
## ステータスバーを上部に表示する
set -g status-position top

# コピーモードを設定する
## viのキーバインドを使用する
setw -g mode-keys vi
## クリップボード共有を有効にする
## set-option -g default-command "reattach-to-user-namespace -l zsh"
## コピーモードの操作をvi風に設定する    
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"


run '~/.tmux/plugins/tpm/tpm'
